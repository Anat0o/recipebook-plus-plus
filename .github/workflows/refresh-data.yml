name: Проверка новых версий Minecraft

on:
  schedule:
    # Ежедневно в 06:00 UTC — mcmeta обычно успевает обновиться после релиза.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Версия для добавления в набор (например 26.3)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сравнить с последним релизом в mcmeta
        id: check
        run: npx tsx tools/check-new-version.ts
        env:
          REQUESTED_VERSION: ${{ inputs.version }}

      - name: Открыть pull request с новой версией
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/${{ steps.check.outputs.version }}
          title: 'Данные: добавить Minecraft ${{ steps.check.outputs.version }}'
          body: |
            Вышла новая версия Minecraft — **${{ steps.check.outputs.version }}**.

            Изменён `tools/config.ts`. Перед вливанием проверьте, что сборка данных
            и отчёт покрытия проходят: неизвестные конструкции в таблицах добычи
            и неразобранные рецепты означают, что формат данных поменялся.
          commit-message: 'Данные: добавить Minecraft ${{ steps.check.outputs.version }}'
